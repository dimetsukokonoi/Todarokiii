<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Task Manager Home</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary": "#ae2f34",
                        "surface-container-low": "#f9f1ff",
                        "on-primary": "#ffffff",
                        "on-surface": "#1d1a24",
                        "on-error": "#ffffff",
                        "tertiary-container": "#caa900",
                        "surface-tint": "#732ee4",
                        "surface-container-highest": "#e8dfee",
                        "surface-variant": "#e8dfee",
                        "on-secondary-container": "#6d0010",
                        "on-tertiary-fixed-variant": "#554500",
                        "on-background": "#1d1a24",
                        "on-secondary-fixed-variant": "#8c1520",
                        "secondary-fixed": "#ffdad8",
                        "primary-container": "#7c3aed",
                        "on-secondary": "#ffffff",
                        "primary": "#630ed4",
                        "surface-container": "#f3ebfa",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#5a00c6",
                        "on-primary-container": "#ede0ff",
                        "on-secondary-fixed": "#410006",
                        "secondary-fixed-dim": "#ffb3b0",
                        "surface-dim": "#dfd7e6",
                        "inverse-primary": "#d2bbff",
                        "tertiary": "#705d00",
                        "primary-fixed-dim": "#d2bbff",
                        "surface-container-high": "#ede5f4",
                        "on-error-container": "#93000a",
                        "error-container": "#ffdad6",
                        "outline": "#7b7487",
                        "inverse-surface": "#332f39",
                        "background": "#fef7ff",
                        "tertiary-fixed": "#ffe173",
                        "on-surface-variant": "#4a4455",
                        "outline-variant": "#ccc3d8",
                        "error": "#ba1a1a",
                        "primary-fixed": "#eaddff",
                        "surface": "#fef7ff",
                        "tertiary-fixed-dim": "#e8c426",
                        "secondary-container": "#ff6b6b",
                        "inverse-on-surface": "#f6eefc",
                        "on-tertiary-container": "#4c3e00",
                        "on-tertiary-fixed": "#221b00",
                        "surface-bright": "#fef7ff",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed": "#25005a"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "32px",
                        "xl": "48px",
                        "sm": "12px",
                        "md": "20px",
                        "container-margin": "20px",
                        "base": "8px",
                        "gutter": "16px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "body-lg": ["Geist"],
                        "label-sm": ["Geist"],
                        "headline-lg": ["Geist"],
                        "body-md": ["Geist"],
                        "label-lg": ["Geist"],
                        "headline-md": ["Geist"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                        "headline-lg": ["30px", {"lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "label-lg": ["14px", {"lineHeight": "18px", "fontWeight": "600"}],
                        "headline-md": ["22px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}]

                }
            }
        }

<style>
        body { font-family: 'Geist', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen antialiased flex bg-[#f5f5f5] items-center justify-center py-xl px-md">
<!-- Mobile Device Container (simulated for visual matching) -->
<div class="relative w-full max-w-[400px] h-[850px] bg-[#f8f6f4] rounded-[48px] shadow-2xl overflow-hidden flex flex-col border-[8px] border-primary-container/20">
<!-- TopAppBar (Custom Mobile Version) -->
<header class="flex items-center justify-between px-md py-lg w-full">
<button aria-label="Menu" class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">menu</span>
</button>
<div class="w-12 h-12 rounded-full overflow-hidden border-2 border-surface-container-high bg-surface-variant">
<img alt="User Avatar" class="w-full h-full object-cover" data-alt="A small, close-up portrait of a professional woman with a soft smile, well-lit with natural light. The background is softly blurred. This serves as a placeholder avatar in a light-themed, modern task management application, contributing to a friendly and approachable user interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC5sSD3YDboHmjU59fLNhhN1hnHz8DQ2qzJuC9NoogphDDti0IEQFCgn66cEaUzcIEZniGMl5j_ZUZr_aWKewUa-bbuggKt9gLnGaekbMIVCx9uIWYXxdcJWs83AdHhFlPivOMyRViUw8DZtSV_zUEdN-2PUIZtk_2XerCk3BaHFWvgrtZ6NgS9ExOuTP963eorAoHrfntE2TC3sm8vFMK2uM0dIJKciKt2prGKKf2iXvq91gGtwNs31yh6XM2EJlGRH9tOQD5ssZwl"/>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto px-md pb-xl hide-scrollbar" style="scrollbar-width: none; -ms-overflow-style: none;">
<!-- Greeting Section -->
<section class="mb-lg">
<h1 class="font-headline-md text-headline-md text-on-background flex items-center gap-2 mb-xs">
                    Good Morning, Mabal 
                    <span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">partly_cloudy_day</span>
</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant leading-tight">
                    You have <span class="font-bold text-primary">Eight</span> task to complete today
                </p>
</section>
<!-- Search Bar -->
<div class="relative mb-xl shadow-sm rounded-full">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">search</span>
<input class="w-full h-14 pl-12 pr-4 rounded-full bg-surface-container-lowest border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-md text-body-md text-on-surface placeholder:text-outline transition-all" placeholder="Search" type="text"/>
</div>
<!-- Action Buttons Row -->
<div class="flex justify-between items-center px-4 mb-xl">
<!-- To-Do -->
<button class="flex flex-col items-center gap-2 group">
<div class="w-16 h-16 rounded-full border-2 border-secondary-container bg-surface-container-lowest flex items-center justify-center group-hover:bg-secondary-container/10 transition-colors">
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">format_list_bulleted</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant font-semibold">To-Do</span>
</button>
<!-- Add new -->
<button class="flex flex-col items-center gap-2 group">
<div class="w-16 h-16 rounded-full border-2 border-tertiary-fixed-dim bg-surface-container-lowest flex items-center justify-center group-hover:bg-tertiary-fixed-dim/10 transition-colors">
<span class="material-symbols-outlined text-tertiary-fixed-dim">add</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant font-semibold">Add new</span>
</button>
<!-- Done -->
<button class="flex flex-col items-center gap-2 group">
<div class="w-16 h-16 rounded-full border-2 border-green-500 bg-surface-container-lowest flex items-center justify-center group-hover:bg-green-500/10 transition-colors">
<span class="material-symbols-outlined text-green-500" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant font-semibold">Done</span>
</button>
</div>
<!-- Weekly Projects Section -->
<section>
<h2 class="font-headline-md text-headline-md font-bold text-on-background mb-md">Weekly projects</h2>
<div class="flex flex-col gap-sm">
<!-- Project Card 1 -->
<div class="bg-surface-container-lowest rounded-DEFAULT p-md border border-outline-variant shadow-sm relative overflow-hidden group hover:shadow-md transition-shadow cursor-pointer">
<!-- Abstract Background Decoration -->
<div class="absolute right-0 top-0 bottom-0 w-32 opacity-20 pointer-events-none" style="background-image: radial-gradient(circle, #7c3aed 1.5px, transparent 1.5px); background-size: 8px 8px;"></div>
<div class="relative z-10">
<h3 class="font-label-lg text-label-lg font-bold text-on-background mb-1">Travel agency project</h3>
<p class="font-body-md text-body-md text-on-surface-variant mb-4 leading-snug pr-8">
                                Start the project on Monday. Deadline on Wednesday.
                            </p>
<div class="font-label-sm text-label-sm font-semibold text-on-background mb-3">
                                Dead line 10.00 PM
                            </div>
<!-- Progress Bar -->
<div class="mt-4">
<div class="flex justify-between font-label-sm text-label-sm font-bold text-on-background mb-2">
<span>Progress</span>
</div>
<div class="w-full h-2 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary-container rounded-full relative" style="width: 65%;">
<div class="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-primary rounded-full border-2 border-surface-container-lowest shadow-sm translate-x-1/2"></div>
</div>
</div>
</div>
</div>
</div>
<!-- Project Card 2 -->
<div class="bg-surface-container-lowest rounded-DEFAULT p-md border border-outline-variant shadow-sm relative overflow-hidden group hover:shadow-md transition-shadow cursor-pointer mt-sm">
<!-- Abstract Background Decoration -->
<div class="absolute right-0 top-0 bottom-0 w-32 opacity-20 pointer-events-none" style="background-image: radial-gradient(circle, #0ea5e9 1.5px, transparent 1.5px); background-size: 8px 8px;"></div>
<div class="relative z-10">
<h3 class="font-label-lg text-label-lg font-bold text-on-background mb-1">Banking project</h3>
<p class="font-body-md text-body-md text-on-surface-variant mb-4 leading-snug pr-8">
                                Start the project on Thursday. Deadline on Saturday.
                            </p>
<div class="font-label-sm text-label-sm font-semibold text-on-background mb-3">
                                11.00 PM
                            </div>
<!-- Progress Bar -->
<div class="mt-4">
<div class="flex justify-between font-label-sm text-label-sm font-bold text-on-background mb-2">
<span>Progress</span>
</div>
<div class="w-full h-2 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary-container rounded-full relative" style="width: 35%;">
<div class="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-primary rounded-full border-2 border-surface-container-lowest shadow-sm translate-x-1/2"></div>
</div>
</div>
</div>
</div>
</div>
</div>
</section>
</main>
<!-- Subtle Bottom Fade for scroll indication -->
<div class="absolute bottom-0 left-0 right-0 h-8 bg-gradient-to-t from-[#f8f6f4] to-transparent pointer-events-none"></div>
</div>
</body></html>
